<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Diracord: bots de Discord em texto simples">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#7a7a7a"/>
    </linearGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#bdbdbd"/>
      <stop offset="52%" stop-color="#3a3a3a"/>
      <stop offset="70%" stop-color="#e6e6e6"/>
      <stop offset="100%" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.45" r="0.7">
      <stop offset="40%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="400" fill="url(#fade)"/></mask>
    <path id="star" d="M50 0 C53 34 66 47 100 50 C66 53 53 66 50 100 C47 66 34 53 0 50 C34 47 47 34 50 0 Z"/>
  </defs>

  <rect width="1280" height="400" rx="24" fill="#050505"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- chrome stars -->
  <g transform="translate(930 70) scale(2.4)">
    <use href="#star" fill="url(#body)"/>
    <use href="#star" fill="none" stroke="url(#rim)" stroke-width="0.7"/>
  </g>
  <g transform="translate(850 40) scale(0.9)">
    <use href="#star" fill="url(#body)"/>
    <use href="#star" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  </g>
  <g transform="translate(1130 270) scale(0.6)">
    <use href="#star" fill="url(#body)"/>
    <use href="#star" fill="none" stroke="url(#rim)" stroke-width="2"/>
  </g>

  <!-- text -->
  <text x="80" y="212" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="-4" fill="url(#chrome)">Diracord</text>
  <text x="84" y="268" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#a3a3a3">Bots de Discord em texto simples.</text>
  <g transform="translate(84 304)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <rect width="430" height="44" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="20" y="29" fill="#8a8a8a">$</text>
    <text x="42" y="29" fill="#f5f5f5">npx diracord new my-bot</text>
  </g>
</svg>
